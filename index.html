<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seelib VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: a full-screen 3D reading room. Overlay is minimal: wordmark, one hint line, one Enter VR button. Everything else lives in the scene. */
:root {
  color-scheme: dark;
  --night: #0e1520;
  --text: #e7e2d6;
  --muted: #9aa5b4;
  --brass: #d9a441;
  --line: rgba(255,255,255,.18);
  --panel: #16202e;
  --bad: #f0a08a;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--text); font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui {
  position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mark { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.mark span { color: var(--brass); }
.bottom { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
#hint { margin: 0; font-size: 14px; color: var(--text); background: rgba(8,12,19,.7); padding: 8px 12px; border-radius: 8px; max-width: 34ch; }
#enter {
  pointer-events: auto; min-height: 48px; padding: 0 22px; border-radius: 24px; border: 1px solid var(--brass);
  background: var(--brass); color: #1b1408; font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
#enter:disabled { background: rgba(255,255,255,.08); color: var(--muted); border-color: var(--line); cursor: default; }
#enter:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
#openAdd, #addShelf {
  pointer-events: auto; min-height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid var(--brass);
  background: rgba(8,12,19,.7); color: var(--brass); font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
#openAdd:focus-visible, .sbtn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
#sheet {
  position: fixed; inset: 0; z-index: 30; background: rgba(6,9,14,.88); overflow-y: auto; display: flex; align-items: flex-start; justify-content: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#addForm { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-block: auto; }
#addForm h2 { margin: 0; font-size: 28px; line-height: 1; }
.sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.pick { display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--brass); border-radius: 8px; padding: 14px; cursor: pointer; background: rgba(217,164,65,.06); }
.pick span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.pick:focus-within { outline: 2px solid var(--brass); outline-offset: 3px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.field input, .field textarea { font: inherit; font-size: 15px; color: var(--text); background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 84px; }
.st { margin: 0; min-height: 20px; font-size: 13px; color: var(--muted); }
.st.err { color: var(--bad); }
.acts { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.sbtn { min-height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.sbtn.go { background: var(--brass); border-color: var(--brass); color: #1b1408; }
.sbtn:disabled { opacity: .4; cursor: default; }
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; min-width: 0; }
.mine .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mine .nm small { color: var(--muted); margin-left: 6px; }
.mine .none { color: var(--muted); border-top: 0; padding-top: 0; }
#msg { margin: 0; font-size: 13px; color: var(--muted); background: rgba(8,12,19,.7); padding: 6px 10px; border-radius: 8px; max-width: 40ch; }
</style>

</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <h1 class="mark">See<span>lib</span></h1>
  <div class="bottom">
    <p id="hint">Tap a book to read it. Drag to look around.</p>
    <p id="msg" hidden></p>
    <div class="btns">
      <button id="enter" type="button" disabled>Checking for VR&hellip;</button>
      <button id="openAdd" type="button">+ Add your books</button>
      <button id="addShelf" type="button">+ Add shelf</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <form id="addForm" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your books</h2>
    <p class="sub">Add a PDF, a web page saved as HTML, or plain text. Books stay on this device and appear on the lower shelves when you enter VR. Add them here first, then put the headset on.</p>
    <label class="pick" for="file"><strong>Choose a file</strong><span id="fname">PDF, HTML or TXT</span><input id="file" type="file" accept=".pdf,.html,.htm,.txt,.md,application/pdf,text/html,text/plain"></label>
    <label class="field" for="paste">Or paste text<textarea id="paste" placeholder="Paste a chapter or a whole book"></textarea></label>
    <label class="field" for="ttl">Title<input id="ttl" type="text" autocomplete="off" placeholder="Name on the spine"></label>
    <label class="field" for="aut">Author (optional)<input id="aut" type="text" autocomplete="off"></label>
    <p id="st" class="st" role="status"></p>
    <div class="acts"><button type="button" id="closeAdd" class="sbtn">Close</button><button type="submit" id="doAdd" class="sbtn go">Add to shelf</button></div>
    <ul id="mine" class="mine"></ul>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var BOOKS = [
    { title: "Alice's Adventures in Wonderland", short: "Alice in Wonderland", author: "Lewis Carroll", year: "1865", c: "#1f5f63", w: 0.066, h: 0.27,
      pages: [
        ["Chapter I · Down the Rabbit-Hole", "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice, “without pictures or conversations?”"],
        ["Chapter I · Down the Rabbit-Hole", "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her."]
      ] },
    { title: "Pride and Prejudice", short: "Pride and Prejudice", author: "Jane Austen", year: "1813", c: "#6e2430", w: 0.072, h: 0.29,
      pages: [
        ["Chapter I", "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife."],
        ["Chapter I", "However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters."],
        ["Chapter I", "“My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?” Mr. Bennet replied that he had not."]
      ] },
    { title: "Frankenstein", short: "Frankenstein", author: "Mary Shelley", year: "1818", c: "#2f4a35", w: 0.06, h: 0.25,
      pages: [
        ["Letter 1 · To Mrs. Saville, England", "You will rejoice to hear that no disaster has accompanied the commencement of an enterprise which you have regarded with such evil forebodings. I arrived here yesterday, and my first task is to assure my dear sister of my welfare and increasing confidence in the success of my undertaking."],
        ["Letter 1 · To Mrs. Saville, England", "I am already far north of London, and as I walk in the streets of Petersburgh, I feel a cold northern breeze play upon my cheeks, which braces my nerves and fills me with delight."]
      ] },
    { title: "The Time Machine", short: "The Time Machine", author: "H. G. Wells", year: "1895", c: "#24385e", w: 0.058, h: 0.28,
      pages: [
        ["Chapter I · Introduction", "The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His grey eyes shone and twinkled, and his usually pale face was flushed and animated."],
        ["Chapter I · Introduction", "The fire burned brightly, and the soft radiance of the incandescent lights in the lilies of silver caught the bubbles that flashed and passed in our glasses."]
      ] },
    { title: "Treasure Island", short: "Treasure Island", author: "R. L. Stevenson", year: "1883", c: "#a8742a", ink: "#1d1409", w: 0.074, h: 0.26,
      pages: [
        ["Part One · The Old Buccaneer", "Squire Trelawney, Dr. Livesey, and the rest of these gentlemen having asked me to write down the whole particulars about Treasure Island, from the beginning to the end, keeping nothing back but the bearings of the island, and that only because there is still treasure not yet lifted, I take up my pen in the year of grace 17—, and go back to the time when my father kept the Admiral Benbow inn."]
      ] }
  ];

  var PW = 0.36, PH = 0.515, DZ = 0.0016;
  var READ_POS = new THREE.Vector3(0, 1.35, -0.65);
  var READ_YAW = 0;
  var headP = new THREE.Vector3(), headF = new THREE.Vector3();
  var BRASS = 0xd9a441;

  var canvasEl = document.getElementById("gl");
  var hintEl = document.getElementById("hint");
  var msgEl = document.getElementById("msg");
  var enterBtn = document.getElementById("enter");

  var renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x0e1520);
  renderer.xr.enabled = true;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.05, 30);
  var clock = new THREE.Clock();

  function sizeIt() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 1 ? 75 : 55;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", sizeIt);
  sizeIt();
  var flatYaw = 0;
  function applyFlatCam() {
    camera.position.set(0, 1.35, 0.2);
    camera.rotation.order = "YXZ";
    camera.rotation.y = flatYaw;
    camera.rotation.x = -0.02;
    camera.rotation.z = 0;
  }
  applyFlatCam();

  /* ---------- helpers ---------- */
  function tex(cv) {
    var t = new THREE.CanvasTexture(cv);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    return t;
  }
  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function wrap(ctx, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function (w) {
      var test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }
  function paperBg(ctx, w, h, leftShade) {
    var g = ctx.createLinearGradient(0, 0, w, 0);
    if (leftShade) { g.addColorStop(0, "#d8cdb4"); g.addColorStop(0.08, "#ece3cf"); g.addColorStop(1, "#f3ecda"); }
    else { g.addColorStop(0, "#efe6d2"); g.addColorStop(0.92, "#ece3cf"); g.addColorStop(1, "#d8cdb4"); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  var CW = 560, CH = 800, K = 1.5;

  function pageCanvas(kicker, text, folio, left) {
    var cv = mk(CW * K, CH * K), ctx = cv.getContext("2d"); ctx.scale(K, K);
    paperBg(ctx, CW, CH, !left);
    var x0 = left ? 44 : 56;
    ctx.fillStyle = "#7a6a52"; ctx.font = "500 17px Menlo, monospace"; ctx.textBaseline = "alphabetic";
    ctx.fillText((kicker || "").toUpperCase().slice(0, 40), x0, 64);
    var size = 34, lines;
    var maxH = CH - 64 - 90 - 70;
    for (; size >= 22; size -= 2) {
      ctx.font = size + "px Georgia, serif";
      lines = wrap(ctx, text, CW - 56 - 44);
      if (lines.length * size * 1.4 <= maxH) break;
    }
    ctx.fillStyle = "#2b2219";
    lines.forEach(function (l, i) { ctx.fillText(l, x0, 118 + i * size * 1.4); });
    if (folio) { ctx.fillStyle = "#7a6a52"; ctx.font = "16px Menlo, monospace"; ctx.textAlign = "center"; ctx.fillText(folio, CW / 2 + (left ? -6 : 6), CH - 34); }
    return cv;
  }
  function titleCanvas(b) {
    var cv = mk(CW * K, CH * K), ctx = cv.getContext("2d"); ctx.scale(K, K);
    paperBg(ctx, CW, CH, true);
    ctx.fillStyle = "#2b2219"; ctx.textAlign = "center";
    ctx.font = "700 44px Georgia, serif";
    var lines = wrap(ctx, b.title, CW - 150);
    lines.forEach(function (l, i) { ctx.fillText(l, CW / 2 + 8, 250 + i * 54); });
    ctx.font = "italic 28px Georgia, serif";
    ctx.fillText(b.author, CW / 2 + 8, 270 + lines.length * 54);
    ctx.fillStyle = "#7a6a52"; ctx.font = "16px Menlo, monospace";
    ctx.fillText((b.mine ? "YOUR COPY" : b.year + " · PUBLIC DOMAIN"), CW / 2 + 8, 320 + lines.length * 54);
    return cv;
  }
  function coverCanvas(b) {
    var cv = mk(CW * K, CH * K), ctx = cv.getContext("2d"); ctx.scale(K, K);
    ctx.fillStyle = b.c; ctx.fillRect(0, 0, CW, CH);
    var g = ctx.createLinearGradient(0, 0, CW, 0);
    g.addColorStop(0, "rgba(0,0,0,.4)"); g.addColorStop(0.05, "rgba(255,255,255,.1)"); g.addColorStop(0.14, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
    ctx.strokeStyle = "#d9a441"; ctx.globalAlpha = 0.85; ctx.lineWidth = 2; ctx.strokeRect(54, 50, CW - 94, CH - 100); ctx.globalAlpha = 1;
    ctx.fillStyle = b.ink || "#f0e6cf"; ctx.textAlign = "center";
    ctx.font = "700 52px Georgia, serif";
    var lines = wrap(ctx, b.title, CW - 190);
    var y = CH / 2 - (lines.length * 62) / 2;
    lines.forEach(function (l, i) { ctx.fillText(l, CW / 2 + 12, y + i * 62); });
    ctx.fillStyle = "#d9a441"; ctx.fillRect(CW / 2 - 60, y + lines.length * 62 - 10, 144, 3);
    ctx.fillStyle = b.ink || "#f0e6cf"; ctx.font = "500 22px Menlo, monospace";
    ctx.fillText((b.author || "Your copy").toUpperCase(), CW / 2 + 12, y + lines.length * 62 + 50);
    return cv;
  }
  function endpaperCanvas(b) {
    var cv = mk(CW * K, CH * K), ctx = cv.getContext("2d"); ctx.scale(K, K);
    ctx.fillStyle = b.c; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(0, 0, CW, CH);
    ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 6;
    for (var i = -CH; i < CW; i += 24) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + CH, CH); ctx.stroke(); }
    return cv;
  }
  function blankBackCanvas() {
    var cv = mk(CW * K, CH * K), ctx = cv.getContext("2d"); ctx.scale(K, K);
    paperBg(ctx, CW, CH, false);
    return cv;
  }
  function labelCanvas(w, h, lines, opts) {
    var cv = mk(w, h), ctx = cv.getContext("2d");
    ctx.fillStyle = opts.bg || "rgba(8,12,19,.82)"; ctx.fillRect(0, 0, w, h);
    if (opts.border) { ctx.strokeStyle = "#d9a441"; ctx.lineWidth = 4; ctx.strokeRect(3, 3, w - 6, h - 6); }
    ctx.fillStyle = opts.color || "#e7e2d6"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = opts.font || ((opts.size || 44) + "px Georgia, serif");
    var lh = (opts.size || 44) * 1.3, y0 = h / 2 - ((lines.length - 1) * lh) / 2;
    lines.forEach(function (l, i) { ctx.fillText(l, w / 2, y0 + i * lh); });
    return cv;
  }
  function labelMesh(w, h, px, lines, opts) {
    var cv = labelCanvas(px, Math.round(px * h / w), lines, opts);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex(cv), transparent: true }));
    m.userData.cv = cv;
    return m;
  }
  function redraw(mesh, lines, opts) {
    var old = mesh.userData.cv, cv = labelCanvas(old.width, old.height, lines, opts);
    mesh.material.map.dispose();
    mesh.material.map = tex(cv);
    mesh.userData.cv = cv;
  }

  /* ---------- room ---------- */
  scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3b2a1f, 0.9));
  var lamp = new THREE.PointLight(0xffc36b, 1.4, 6);
  lamp.position.set(0.9, 2.3, -0.6);
  scene.add(lamp);

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0x2a1d15, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  var wall = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 4, 48, 1, true), new THREE.MeshStandardMaterial({ color: 0x141d2b, roughness: 1, side: THREE.BackSide }));
  wall.position.set(0, 2, 0);
  scene.add(wall);
  var lamp2 = new THREE.PointLight(0xffc36b, 1.0, 7);
  lamp2.position.set(0, 2.6, 0);
  scene.add(lamp2);

  var wood = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 0.8 });
  var woodBack = new THREE.MeshStandardMaterial({ color: 0x1a2331, roughness: 1 });
  /* ---- the room: bookcases stand in a ring around you, up to six ---- */
  var SW = 1.25;
  var ROW_Y = [1.45, 1.0, 0.6, 0.2];
  var ROW_X0 = -SW / 2 + 0.07;
  var ROW_CAP = 1.15;
  var ROW_ORDER = [2, 3, 1, 0];
  var UNIT_ANG = [0, 0.96, -0.96, 1.92, -1.92, 3.14159];
  var MAX_UNITS = UNIT_ANG.length, RING_R = 1.6;
  var UNITS = [];
  var spines = [];
  var STOCK = BOOKS.length;
  ["alice", "pride", "frank", "time", "treasure"].forEach(function (id, i) { BOOKS[i].id = id; });
  var LAYOUT = { units: 1, rows: {} };
  var LKEY = "seelib.layout.v1";
  var placed = {};
  var MATS = {};
  var booksLoaded = false;
  var lv = new THREE.Vector3(), lv2 = new THREE.Vector3(), carryV = new THREE.Vector3();

  function makeUnit(k) {
    var g = new THREE.Group();
    var ang = UNIT_ANG[k];
    g.position.set(Math.sin(ang) * RING_R, 0, -Math.cos(ang) * RING_R);
    g.rotation.y = -ang;
    function bx(w, h, d, mat, x, y, z) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); g.add(m); }
    bx(SW + 0.1, 1.95, 0.03, woodBack, 0, 0.975, -0.09);
    bx(0.05, 1.95, 0.28, wood, -SW / 2 - 0.025, 0.975, 0);
    bx(0.05, 1.95, 0.28, wood, SW / 2 + 0.025, 0.975, 0);
    [0.2, 0.6, 1.0, 1.45].forEach(function (y) { bx(SW + 0.1, 0.04, 0.28, wood, 0, y, 0); });
    bx(SW + 0.1, 0.05, 0.28, wood, 0, 1.92, 0);
    var sign = labelMesh(0.5, 0.075, 512, ["SHELF " + (k + 1)], { size: 40, font: "600 40px Menlo, monospace", color: "#d9a441", bg: "rgba(8,12,19,0)" });
    sign.position.set(0, 2.03, 0.05);
    g.add(sign);
    scene.add(g);
    g.updateMatrixWorld(true);
    UNITS.push({ group: g });
  }

  function bookById(id) { for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return BOOKS[i]; return null; }
  function bookIndex(id) { for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return i; return -1; }
  function rowWidth(ids) { var w = 0, n = 0; ids.forEach(function (id) { var b = bookById(id); if (b) { w += b.w + (n ? 0.012 : 0); n++; } }); return w; }
  function loadLayout() {
    try {
      var raw = localStorage.getItem(LKEY);
      if (raw) { var o = JSON.parse(raw); if (o && o.rows) LAYOUT = { units: Math.max(1, Math.min(MAX_UNITS, (o.units | 0) || 1)), rows: o.rows }; }
    } catch (e) {}
  }
  function saveLayout() {
    if (!booksLoaded) return;
    try { localStorage.setItem(LKEY, JSON.stringify(LAYOUT)); } catch (e) {}
  }
  function reconcileLayout() {
    var seen = {};
    if (!Object.keys(LAYOUT.rows).length) { LAYOUT.rows["0:0"] = ["alice", "pride", "frank"]; LAYOUT.rows["0:1"] = ["time", "treasure"]; }
    Object.keys(LAYOUT.rows).forEach(function (key) {
      var u = +key.split(":")[0];
      if (u >= LAYOUT.units) { delete LAYOUT.rows[key]; return; }
      LAYOUT.rows[key] = LAYOUT.rows[key].filter(function (id) {
        if (seen[id]) return false;
        if (!bookById(id) && (booksLoaded || id.charAt(0) !== "u")) return false;
        seen[id] = true;
        return true;
      });
    });
    BOOKS.forEach(function (b) {
      if (seen[b.id]) return;
      var done = false;

        g.obj.userData.carry = false;
        showRowGlow(null);
        if (g.near) openBook(g.obj);
        else if (!(g.wp && dropOnShelf(g.obj, g.wp))) snapBack(g.obj);
      } else activate(g.obj);
    } else if (state === "shelf" && g.obj === addBtn) {
      activate(g.obj);
    } else if (state === "reading") {
      if (!g.done && g.moved < 0.04) activate(g.obj);
    } else if (g.carry) snapBack(g.obj);
  }

  var ctrls = [];
  for (var ci = 0; ci < 2; ci++) {
    (function (idx) {
      var c = renderer.xr.getController(idx);
      var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
      var line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: BRASS }));
      line.scale.z = 1.5;
      c.add(line);
      c.userData.line = line;
      c.addEventListener("selectstart", function () { beginGrab(idx, c); });
      c.addEventListener("selectend", function () { endGrab(idx); });
      c.addEventListener("squeezestart", function () { if (state === "reading") closeBook(); });
      scene.add(c);
      ctrls.push(c);
      var hand = renderer.xr.getHand(idx);
      hand.addEventListener("connected", function () {
        try {
          var joints = hand.joints || {};
          Object.keys(joints).forEach(function (k) {
            var s = new THREE.Mesh(new THREE.SphereGeometry(0.007, 8, 8), new THREE.MeshBasicMaterial({ color: BRASS }));
            joints[k].add(s);
          });
        } catch (e) {}
      });
      scene.add(hand);
    })(ci);
  }

  var ptr = new THREE.Vector2();
  var mdown = null;
  canvasEl.addEventListener("pointerdown", function (e) {
    if (renderer.xr.isPresenting) return;
    var r = canvasEl.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ptr, camera);
    var hits = raycaster.intersectObjects(targets(), false);
    mdown = { x: e.clientX, y: e.clientY, lx: e.clientX, obj: hits.length ? hits[0].object : null, looked: false };
  });
  window.addEventListener("pointermove", function (e) {
    if (!mdown || mdown.obj || state !== "shelf" || renderer.xr.isPresenting) return;
    var dxm = e.clientX - mdown.lx;
    if (Math.abs(e.clientX - mdown.x) > 6) mdown.looked = true;
    flatYaw += dxm * 0.006;
    mdown.lx = e.clientX;
    applyFlatCam();
  });
  window.addEventListener("pointerup", function (e) {
    if (!mdown) return;
    var m = mdown; mdown = null;
    if (renderer.xr.isPresenting) return;
    var dx = e.clientX - m.x, dy = e.clientY - m.y;
    if (state === "reading" && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
    else if (state === "reading" && dy > 70 && dy > Math.abs(dx) * 1.2) closeBook();
    else if (!m.looked && Math.abs(dx) < 12 && Math.abs(dy) < 12 && m.obj) activate(m.obj);
  });
  window.addEventListener("pointercancel", function () { mdown = null; });
  window.addEventListener("keydown", function (e) {
    if (sheetEl && !sheetEl.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight" && state === "reading") next();
    else if (e.key === "ArrowLeft" && state === "reading") prev();
    else if (e.key === "ArrowRight" && state === "shelf") { flatYaw -= 0.3; applyFlatCam(); }
    else if (e.key === "ArrowLeft" && state === "shelf") { flatYaw += 0.3; applyFlatCam(); }
    else if (e.key === "Escape") closeBook();
  });

  /* ---------- your own books: kept on this device, shown on the lower shelves ---------- */
  var USER = [];
  var PALETTE = ["#5a3b6e", "#3b5a6e", "#6e5a3b", "#2e5a4a", "#7a3b3b", "#3b3f6e", "#55612f"];
  var HEAD_RE = /^(chapter|part|book|section|prologue|epilogue|preface|introduction|letter|act|canto|volume)\b/i;
  var PAGE_LIMIT = 420;
  var sheetEl = document.getElementById("sheet"), fileIn = document.getElementById("file"), pasteIn = document.getElementById("paste");
  var ttlIn = document.getElementById("ttl"), autIn = document.getElementById("aut"), stEl = document.getElementById("st");
  var doAddBtn = document.getElementById("doAdd"), mineEl = document.getElementById("mine"), openAddBtn = document.getElementById("openAdd");
  var dbp = null, shownCount = 0, saveOk = true;

  function dbOpen() {
    if (!dbp) dbp = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open("seelib", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("books", { keyPath: "id" }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function dbAll() {
    return dbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var r = db.transaction("books").objectStore("books").getAll();
        r.onsuccess = function () { res(r.result || []); };
        r.onerror = function () { rej(r.error); };
      });
    });
  }
  function dbPut(b) {
    return dbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("books", "readwrite");
        tx.objectStore("books").put(JSON.parse(JSON.stringify(b)));
        tx.oncomplete = res; tx.onerror = tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function dbDel(id) {
    return dbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("books", "readwrite");
        tx.objectStore("books").delete(id);
        tx.oncomplete = res; tx.onerror = tx.onabort = function () { rej(tx.error); };
      });
    });
  }

  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function stat(msg, err) { stEl.textContent = msg || ""; stEl.className = "st" + (err ? " err" : ""); }
  function hashOf(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return Math.abs(h); }

  function renderList() {
    var h = "";
    if (!USER.length) h = '<li class="none">No books added yet.</li>';
    USER.forEach(function (b, i) {
      h += '<li><span class="nm">' + esc(b.title) + '<small>' + b.pages.length + ' pages' + (!placed[b.id] ? ' · not on shelf' : '') + '</small></span><button type="button" class="sbtn" data-del="' + esc(b.id) + '">Remove</button></li>';
    });
    mineEl.innerHTML = h;
  }
  function syncBooks() {
    BOOKS.length = STOCK;
    USER.forEach(function (b) { BOOKS.push(b); });
    reconcileLayout();
    saveLayout();
    renderLayout();
    renderList();
  }

  var LIMIT_FULL_MSG = "The room is full. Remove a book to make room.";

  function splitLong(p) {
    var out = [];
    while (p.length > PAGE_LIMIT) {
      var cut = p.lastIndexOf(". ", PAGE_LIMIT);
      if (cut < PAGE_LIMIT * 0.45) cut = p.lastIndexOf("? ", PAGE_LIMIT);
      if (cut < PAGE_LIMIT * 0.45) cut = p.lastIndexOf("! ", PAGE_LIMIT);
      if (cut < PAGE_LIMIT * 0.45) cut = p.lastIndexOf(" ", PAGE_LIMIT);
      if (cut < 1) cut = PAGE_LIMIT;
      out.push(p.slice(0, cut + 1).trim());
      p = p.slice(cut + 1).trim();
    }
    if (p) out.push(p);
    return out;
  }
  function paginate(text) {
    text = text.replace(/\r/g, "").replace(/[ \t ]+/g, " ");
    var raw = text.split(/\n\s*\n+/).map(function (p) { return p.replace(/\s*\n\s*/g, " ").trim(); }).filter(Boolean);
    var pages = [], buf = "", kicker = "";
    function flush() { if (buf) pages.push([kicker, buf.trim()]); buf = ""; }
    raw.forEach(function (p) {
      var isHead = false;
      if (p.charAt(0) === "\u0001") { isHead = true; p = p.slice(1).trim(); }
      else if (p.length < 70 && HEAD_RE.test(p)) isHead = true;
      if (isHead && p) { flush(); kicker = p.length > 40 ? p.slice(0, 37) + "…" : p; return; }
      splitLong(p).forEach(function (chunk) {
        if (buf && buf.length + chunk.length + 1 > PAGE_LIMIT) flush();
        buf += (buf ? " " : "") + chunk;
      });
    });
    flush();
    return pages;
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement("script");
      el.src = src; el.onload = res;
      el.onerror = function () { rej(new Error("Could not load the PDF reader. Check the connection, or paste the text instead.")); };
      document.head.appendChild(el);
    });
  }
  async function pdfToText(file, report) {
    if (!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var data = await file.arrayBuffer();
    var pdf = await window.pdfjsLib.getDocument({ data: data }).promise;
    var out = [];
    for (var n = 1; n <= pdf.numPages; n++) {
      report("Reading page " + n + " of " + pdf.numPages + "…");
      var page = await pdf.getPage(n);
      var tc = await page.getTextContent();
      var text = "", lastY = null;
      tc.items.forEach(function (it) {
        if (typeof it.str !== "string") return;
        var y = it.transform[5], hh = Math.abs(it.transform[3]) || 10;
        if (lastY !== null && Math.abs(y - lastY) > 0.5) text += Math.abs(y - lastY) > hh * 1.9 ? "\n\n" : " ";
        text += it.str; lastY = y;
      });
      out.push(text.trim());
    }
    var joined = "";
    out.forEach(function (t) {
      if (!t) return;
      if (!joined) { joined = t; return; }
      joined += /[.!?"”]$/.test(joined) ? "\n\n" + t : " " + t;
    });
    return { text: joined, title: "" };
  }
  function htmlToText(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    ["script", "style", "nav", "header", "footer", "aside", "noscript", "form", "svg", "iframe"].forEach(function (tag) {
      doc.querySelectorAll(tag).forEach(function (n) { n.remove(); });
    });
    var parts = [];
    doc.body.querySelectorAll("h1,h2,h3,h4,p,li").forEach(function (el) {
      var t = el.textContent.replace(/\s+/g, " ").trim();
      if (!t) return;
      parts.push(/^H[1-4]$/.test(el.tagName) ? "\u0001" + t : t);
    });
    return { text: parts.join("\n\n"), title: (doc.title || "").trim() };
  }
  async function readSource(file, pasted, report) {
    if (file) {
      var name = file.name.toLowerCase();
      if (/\.pdf$/.test(name) || file.type === "application/pdf") return pdfToText(file, report);
      var raw = await file.text();
      if (/\.html?$/.test(name) || file.type === "text/html") return htmlToText(raw);
      return { text: raw, title: "" };
    }
    return { text: pasted, title: "" };
  }

  function openSheet() {
    if (state !== "shelf") { say("Put the book back first, then add books."); return; }
    sheetEl.hidden = false;
    fileIn.value = ""; pasteIn.value = ""; ttlIn.value = ""; autIn.value = "";
    document.getElementById("fname").textContent = "PDF, HTML or TXT";
    stat("");
    doAddBtn.disabled = false;
    renderList();
    ttlIn.focus();
  }
  function closeSheet() { sheetEl.hidden = true; openAddBtn.focus(); }
  openAddBtn.addEventListener("click", openSheet);
  document.getElementById("closeAdd").addEventListener("click", closeSheet);
  sheetEl.addEventListener("pointerdown", function (e) { if (e.target === sheetEl) closeSheet(); });
  fileIn.addEventListener("change", function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) { document.getElementById("fname").textContent = "PDF, HTML or TXT"; return; }
    document.getElementById("fname").textContent = f.name;
    if (!ttlIn.value.trim()) ttlIn.value = f.name.replace(/\.[a-z0-9]+$/i, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim();
    stat("");
  });
  mineEl.addEventListener("click", function (e) {
    var id = e.target && e.target.getAttribute && e.target.getAttribute("data-del");
    if (!id) return;
    USER = USER.filter(function (b) { return b.id !== id; });
    dbDel(id).catch(function () {});
    syncBooks();
  });
  document.getElementById("addForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var f = fileIn.files && fileIn.files[0], pasted = pasteIn.value.trim();
    if (!f && !pasted) { stat("Choose a file or paste some text first.", true); return; }
    if (USER.some(function (bk) { return !placed[bk.id]; })) { stat(LIMIT_FULL_MSG, true); return; }
    doAddBtn.disabled = true;
    stat("Reading…");
    try {
      var src = await readSource(f, pasted, stat);
      var text = (src.text || "").trim();
      if (text.length < 200) {
        stat(f && /pdf/i.test(f.name + f.type) ? "No readable text found. This PDF may be scanned pictures of pages, which Seelib cannot read yet." : "There is not enough text there to make a book.", true);
        doAddBtn.disabled = false; return;
      }
      if (text.length > 2500000) text = text.slice(0, 2500000);
      stat("Making pages…");
      var pages = paginate(text);
      if (!pages.length) { stat("Could not make pages from that text.", true); doAddBtn.disabled = false; return; }
      var title = ttlIn.value.trim() || src.title || (f ? f.name.replace(/\.[a-z0-9]+$/i, "") : "Untitled");
      var seed = hashOf(title + text.length);
      var book = {
        id: "u" + Date.now().toString(36), mine: true, created: Date.now(),
        title: title, short: title, author: autIn.value.trim(), year: "",
        c: PALETTE[seed % PALETTE.length],
        w: Math.max(0.045, Math.min(0.075, 0.04 + pages.length / 800)),
        h: 0.25 + (seed % 5) * 0.02,
        pages: pages
      };
      USER.push(book);
      dbPut(book).catch(function () { saveOk = false; say("This browser would not keep your books. They stay until you close the page."); });
      syncBooks();
      sheetEl.hidden = true;
      hintEl.textContent = "Added. Find it on the lower shelf.";
      openAddBtn.focus();
    } catch (err) {
      stat((err && err.message) ? "Could not read that file: " + err.message : "Could not read that file.", true);
      doAddBtn.disabled = false;
    }
  });

  syncBooks();
  document.getElementById("addShelf").addEventListener("click", addShelf);
  dbAll().then(function (rows) {
    rows.sort(function (a, b) { return (a.created || 0) - (b.created || 0); });
    USER = rows;
    booksLoaded = true;
    syncBooks();
  }).catch(function () { saveOk = false; booksLoaded = true; syncBooks(); });

  /* ---------- enter VR ---------- */
  var xrSession = null;
  function say(t) { msgEl.textContent = t; msgEl.hidden = !t; }
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
      if (ok) { enterBtn.disabled = false; enterBtn.textContent = "Enter VR"; }
      else { enterBtn.textContent = "VR not available here"; say("Open this link in the headset browser to enter VR. You can still try it here by tapping."); }
    }).catch(function () { enterBtn.textContent = "VR not available here"; });
  } else {
    enterBtn.textContent = "VR not available here";
    say(window.isSecureContext ? "This browser has no VR support. Open the link in the headset browser. You can still try it here by tapping." : "VR needs a secure (https) page.");
  }
  enterBtn.addEventListener("click", function () {
    if (xrSession) { xrSession.end(); return; }
    navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor", "bounded-floor", "hand-tracking"] }).then(function (s) {
      xrSession = s;
      renderer.xr.setReferenceSpaceType("local-floor");
      renderer.xr.setSession(s);
      enterBtn.textContent = "Exit VR";
      s.addEventListener("end", function () { grabs = [null, null]; readRing.visible = false; xrSession = null; enterBtn.textContent = "Enter VR"; applyFlatCam(); });
    }).catch(function (err) { say("Could not start VR: " + (err && err.message ? err.message : "unknown error")); });
  });

  /* ---------- loop ---------- */
  var hovered = null;
  function ease(t) { return 1 - Math.pow(1 - t, 3); }
  renderer.setAnimationLoop(function () {
    var dt = Math.min(clock.getDelta(), 0.1);
    Object.keys(winLeaves).forEach(function (k) {
      var l = winLeaves[k];
      l.rotation.y += (l.userData.target - l.rotation.y) * Math.min(1, dt * 5);
      l.position.z += (l.userData.zT - l.position.z) * Math.min(1, dt * 8);
    });
    bookG.position.x += (bookTargetX - bookG.position.x) * Math.min(1, dt * 5);
    if (tween) {
      tween.t += tween.dir * dt / 0.7;
      var t = Math.max(0, Math.min(1, tween.t));
      var e = ease(t);
      rg.position.lerpVectors(tween.from, READ_POS, e);
      rg.scale.setScalar((0.3 + 0.7 * e) * (tween.dir > 0 ? 1 : readScale));
      if (tween.dir > 0 && t >= 1) { tween = null; state = "reading"; }
      else if (tween.dir < 0 && t <= 0) { tween = null; rg.visible = false; activeSpine.visible = true; state = "shelf"; }
    }
    if (state === "shelf") {
      updateReadPos();
      var yd = Math.abs(Math.atan2(Math.sin(READ_YAW - addBtnYaw), Math.cos(READ_YAW - addBtnYaw)));
      if (yd > 0.6) placeAddBtn();
    }
    addBtn.visible = state === "shelf";
    var carrying = false, nearRing = false;
    grabs.forEach(function (g) {
      if (!g) return;
      updateGrab(g);
      if (g.carry && state === "shelf") { carrying = true; if (g.near) nearRing = true; }
    });
    readRing.visible = carrying;
    if (carrying) { readRing.position.copy(READ_POS); readRing.rotation.y = -READ_YAW; }
    readRing.material.opacity = nearRing ? 0.95 : 0.35;
    spines.forEach(function (sp) {
      var sn = sp.userData.snap;
      if (!sn) return;
      sn.t += dt / 0.3;
      var tt = Math.min(1, sn.t), ee = ease(tt), sc = 1.5 - 0.5 * ee;
      sp.position.lerpVectors(sn.from, sp.userData.home, ee);
      sp.scale.set(sc, sc, sc);
      if (tt >= 1) { sp.position.copy(sp.userData.home); sp.scale.set(1, 1, 1); delete sp.userData.snap; }
    });
    if (state === "reading") { var zs = rg.scale.x + (readScale - rg.scale.x) * Math.min(1, dt * 6); rg.scale.setScalar(zs); }
    var over = null;
    if (renderer.xr.isPresenting) {
      ctrls.forEach(function (c) {
        var h = pickFromController(c);
        c.userData.line.scale.z = h ? h.distance : 1.5;
        if (h && h.object.userData.book !== undefined) over = h.object;
      });
      var gh = pickFromGaze();
      updateReticle(gh);
      if (!over && gh && gh.object.userData.book !== undefined) over = gh.object;
    } else {
      reticle.visible = false;
    }
    if (over && (over.userData.carry || over.userData.snap)) over = null;
    if (over !== hovered) {
      if (hovered && !hovered.userData.carry && !hovered.userData.snap) hovered.scale.set(1, 1, 1);
      if (over) over.scale.set(1.08, 1.04, 1.25);
      hovered = over;
    }
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
